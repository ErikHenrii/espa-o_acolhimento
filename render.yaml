services:
  - type: web
    name: espaco-acolhimento-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: THERAPIST_EMAIL
        value: jaqueline@espacoacolhimento.com.br
      - key: THERAPIST_PASSWORD
        value: jac123456
      - key: DATABASE_URL
        fromDatabase:
          name: espaco-acolhimento-db
          property: connectionString

databases:
  - name: espaco-acolhimento-db
    plan: free
