services:
  - type: web
    name: espaco-acolhimento-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: espaco-acolhimento-db
          property: connectionString

databases:
  - name: espaco-acolhimento-db
    plan: free
    databaseName: espaco_acolhimento
    user: espaco_user
