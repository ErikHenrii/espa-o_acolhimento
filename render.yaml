services:
  - type: web
    name: espaco-acolhimento-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: THERAPIST_EMAIL
        value: jaqueline@espacoacolhimento.com.br
      - key: THERAPIST_PASSWORD
        value: jac123456
      - key: THERAPIST_NAME
        value: Jaqueline Camila
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: espaco-acolhimento-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: espaco-acolhimento-db
    plan: free
    databaseName: espaco_acolhimento
    user: espaco_user
