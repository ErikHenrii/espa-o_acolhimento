<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espaço de Acolhimento - Jaqueline Camila | Portal de Acesso</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'teal-dark': '#0f766e',
            'teal-medium': '#14b8a6',
            'teal-light': '#2dd4bf',
            'amber-gold': '#ca8a04',
            'amber-soft': '#fef08a',
            'bg-neu': '#e0f2f1',
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-900 via-teal-800 to-amber-900 flex flex-col justify-between items-center p-4 relative overflow-x-hidden font-sans">

  <!-- Background Animated Decorative Blobs -->
  <div class="absolute top-10 left-10 w-72 h-72 bg-teal-400 opacity-20 rounded-full filter blur-3xl animate-float pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-96 h-96 bg-amber-500 opacity-20 rounded-full filter blur-3xl animate-float pointer-events-none" style="animation-delay: -3s;"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-teal-300 opacity-15 rounded-full filter blur-2xl animate-pulse-glow pointer-events-none"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>
  <!-- Back to site link -->
  <a href="index.html" class="absolute top-4 left-4 z-20 text-white/80 hover:text-white text-sm font-medium flex items-center gap-2 transition-all">
    <i class="fa-solid fa-arrow-left"></i> Voltar ao site
  </a>

  <!-- Header / Brand Logo -->
  <header class="w-full max-w-md pt-6 text-center z-10">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 mb-3 shadow-lg text-amber-300">
      <i class="fa-solid fa-spa text-3xl"></i>
    </div>
    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-wide">Espaço de Acolhimento</h1>
    <p class="text-teal-200 text-sm font-medium mt-1">Jaqueline Camila • Psicologia & Psicoterapia</p>
  </header>

  <!-- Main Auth Card Container -->
  <main class="w-full max-w-[420px] my-auto py-6 z-10">
    <div class="glass border border-white/30 rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden backdrop-blur-xl">
      
      <!-- Profile Role Switcher (Sou Paciente / Sou Terapeuta) -->
      <div class="bg-teal-950/20 p-1.5 rounded-2xl flex items-center mb-6 border border-white/10">
        <button id="role-paciente-btn" type="button" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-white text-teal-900 shadow-md">
          <i class="fa-solid fa-user-heart mr-1.5 text-teal-600"></i> Sou Paciente
        </button>
        <button id="role-terapeuta-btn" type="button" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-teal-100 hover:text-white">
          <i class="fa-solid fa-user-doctor mr-1.5 text-amber-300"></i> Sou Terapeuta
        </button>
      </div>

      <!-- Auth Tabs (Entrar / Cadastrar) - Only active for Paciente -->
      <div id="auth-tabs" class="flex border-b border-teal-700/20 mb-6">
        <button id="tab-login" type="button" class="flex-1 pb-3 text-center text-sm font-bold text-teal-900 border-b-2 border-amber-500 transition-all duration-200">
          Entrar
        </button>
        <button id="tab-register" type="button" class="flex-1 pb-3 text-center text-sm font-medium text-slate-500 border-b-2 border-transparent hover:text-teal-800 transition-all duration-200">
          Cadastrar
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-teal-950 uppercase tracking-wider mb-1.5">E-mail</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-teal-600">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <input type="email" id="login-email" required placeholder="seu@email.com" 
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-teal-50/50 border border-teal-200/60 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm text-slate-800 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-teal-950 uppercase tracking-wider mb-1.5">Senha</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-teal-600">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" id="login-password" required placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-3 rounded-xl bg-teal-50/50 border border-teal-200/60 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm text-slate-800 transition-all">
            <button type="button" id="toggle-login-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-teal-700">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center text-slate-600 cursor-pointer">
            <input type="checkbox" class="rounded border-teal-300 text-teal-600 focus:ring-teal-500 mr-2">
            Lembrar-me
          </label>
          <a href="#" id="forgot-password-link" class="text-teal-700 hover:text-amber-700 font-medium">Esqueceu a senha?</a>
        </div>

        <button type="submit" id="btn-login-submit" 
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-teal-700 via-teal-600 to-amber-600 text-white font-bold text-sm shadow-lg hover:shadow-xl hover:opacity-95 transform active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 mt-2">
          <span>Entrar no Portal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- REGISTER FORM (Hidden by default) -->
      <form id="register-form" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-teal-950 uppercase tracking-wider mb-1.5">Nome Completo</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-teal-600">
              <i class="fa-solid fa-user"></i>
            </div>
            <input type="text" id="reg-name" required placeholder="Seu nome e sobrenome" 
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-teal-50/50 border border-teal-200/60 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm text-slate-800 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-teal-950 uppercase tracking-wider mb-1.5">E-mail</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-teal-600">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <input type="email" id="reg-email" required placeholder="seu@email.com" 
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-teal-50/50 border border-teal-200/60 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm text-slate-800 transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-teal-950 uppercase tracking-wider mb-1.5">Senha</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-teal-600">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres" 
              class="w-full pl-10 pr-10 py-3 rounded-xl bg-teal-50/50 border border-teal-200/60 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm text-slate-800 transition-all">
            <button type="button" id="toggle-reg-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-teal-700">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-teal-950 uppercase tracking-wider mb-1.5">Confirmar Senha</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-teal-600">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <input type="password" id="reg-confirm-password" required placeholder="Repita a senha" 
              class="w-full pl-10 pr-4 py-3 rounded-xl bg-teal-50/50 border border-teal-200/60 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm text-slate-800 transition-all">
          </div>
        </div>

        <button type="submit" id="btn-register-submit" 
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-amber-600 via-teal-600 to-teal-700 text-white font-bold text-sm shadow-lg hover:shadow-xl hover:opacity-95 transform active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 mt-2">
          <span>Criar Minha Conta</span>
          <i class="fa-solid fa-heart text-xs"></i>
        </button>
      </form>

      <!-- Decorative Social Login Section -->
      <div class="mt-6 pt-5 border-t border-teal-700/15 text-center">
        <p class="text-xs text-slate-500 mb-3 font-medium">Ou continue com</p>
        <button type="button" id="btn-google-login" class="w-full py-2.5 px-4 rounded-xl bg-white/80 hover:bg-white border border-teal-200 text-slate-700 font-medium text-xs shadow-sm hover:shadow transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google (Em breve)</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-md pb-4 text-center text-xs text-teal-100/80 z-10">
    <p>© 2026 Espaço de Acolhimento • Jaqueline Camila</p>
    <p class="text-[11px] text-teal-200/60 mt-0.5">Psicologia Clínica & Psicoterapia • Todos os direitos reservados</p>
  </footer>

  <!-- Auth JS Logic -->
  <script src="js/auth.js"></script>
</body>
</html>
